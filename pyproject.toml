[project]
name = "techweek-etl"
version = "0.1.0"
description = "Local, cautious Tech Week event discovery and calendar sync"
requires-python = ">=3.13,<3.14"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "google-api-python-client>=2.0,<3",
  "google-auth-oauthlib>=1.2,<2",
  "httpx>=0.27,<1",
  "playwright>=1.48,<2",
]

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
